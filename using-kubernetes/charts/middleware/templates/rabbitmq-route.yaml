{{- if and .Values.rabbitmq.enabled .Values.rabbitmq.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rabbitmq-management
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: ecommerce }
spec:
  parentRefs:
    - { name: {{ .Values.rabbitmq.route.gateway.name }}, namespace: {{ .Values.rabbitmq.route.gateway.namespace }} }
  hostnames: [{{ .Values.rabbitmq.route.host }}]
  rules:
    - backendRefs:
        - { name: rabbitmq, port: 15672 }
{{- end }}
