# product-service — Python / FastAPI / MongoDB
image:
  repository: ecommerce/product-service
  tag: ""            # empty = global.imageTag
replicas: 1
port: 8001
health: /health
startupSeconds: 60   # how long the startup probe waits before giving up
otel: true           # inject OTEL_* env (endpoint, service name, k8s pod attributes)

# Dependencies to wait for (init containers) — Kubernetes has no depends_on.
waitFor: 
  - "{{ .Values.global.hosts.mongodb }}:27017"

# Keys read from the shared credentials Secret (global.credentialsSecret).
secretEnv: []

# Plain settings. $(VAR) expands other env vars, e.g. secret values above.
env: 
  MONGO_URI: "mongodb://{{ .Values.global.hosts.mongodb }}:27017"
  ERROR_RATE: "0.02"
  SLOW_RATE: "0.03"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_PYTHON_LOG_CORRELATION: "true"

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { memory: 256Mi }
