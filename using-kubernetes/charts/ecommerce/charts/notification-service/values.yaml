# notification-service — Node.js / RabbitMQ
image:
  repository: ecommerce/notification-service
  tag: ""            # empty = global.imageTag
replicas: 1
port: 8005
health: /health
startupSeconds: 40   # how long the startup probe waits before giving up
otel: true           # inject OTEL_* env (endpoint, service name, k8s pod attributes)

# Dependencies to wait for (init containers) — Kubernetes has no depends_on.
waitFor: 
  - "{{ .Values.global.hosts.rabbitmq }}:5672"

# Keys read from the shared credentials Secret (global.credentialsSecret).
secretEnv: 
  - RABBITMQ_USER
  - RABBITMQ_PASSWORD

# Plain settings. $(VAR) expands other env vars, e.g. secret values above.
env: 
  RABBITMQ_EXCHANGE: "ecommerce.events"
  RABBITMQ_URL: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@{{ .Values.global.hosts.rabbitmq }}:5672"

resources:
  requests: { cpu: 25m, memory: 48Mi }
  limits: { memory: 128Mi }
