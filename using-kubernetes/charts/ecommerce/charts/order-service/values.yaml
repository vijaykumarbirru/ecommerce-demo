# order-service — Java / Spring Boot / Postgres / RabbitMQ
image:
  repository: ecommerce/order-service
  tag: ""            # empty = global.imageTag
replicas: 1
port: 8003
health: /orders/health   # controller is mapped under /orders
startupSeconds: 150   # how long the startup probe waits before giving up
otel: true           # inject OTEL_* env (endpoint, service name, k8s pod attributes)

# Dependencies to wait for (init containers) — Kubernetes has no depends_on.
waitFor: 
  - "{{ .Values.global.hosts.postgres }}:5432"
  - "{{ .Values.global.hosts.rabbitmq }}:5672"

# Keys read from the shared credentials Secret (global.credentialsSecret).
secretEnv: 
  - POSTGRES_USER
  - POSTGRES_PASSWORD
  - RABBITMQ_USER
  - RABBITMQ_PASSWORD

# Plain settings. $(VAR) expands other env vars, e.g. secret values above.
env: 
  POSTGRES_HOST: "{{ .Values.global.hosts.postgres }}"
  POSTGRES_DB: "shop"
  RABBITMQ_HOST: "{{ .Values.global.hosts.rabbitmq }}"
  RABBITMQ_EXCHANGE: "ecommerce.events"
  OTEL_LOGS_EXPORTER: "none"
  JAVA_TOOL_OPTIONS: "-Xms128m"

resources:
  requests: { cpu: 100m, memory: 320Mi }
  limits: { memory: 640Mi }
