apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.credentialsSecret }}
  labels: { app.kubernetes.io/part-of: ecommerce, app.kubernetes.io/managed-by: {{ .Release.Service }} }
type: Opaque
stringData:
  {{- range $k, $v := .Values.credentials }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
