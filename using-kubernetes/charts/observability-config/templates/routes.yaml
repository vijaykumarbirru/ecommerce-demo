{{- range $name, $r := .Values.routes }}
{{- if $r }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/part-of: observability }
spec:
  parentRefs:
    - { name: {{ $.Values.gateway.name }}, namespace: {{ $.Values.gateway.namespace }} }
  hostnames: [{{ $r.host }}]
  rules:
    - backendRefs:
        - { name: {{ $r.service }}, port: {{ $r.port }} }
---
{{- end }}
{{- end }}
