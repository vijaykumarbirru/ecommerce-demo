# Local 3-node Kubernetes cluster for the e-commerce demo.
#   kind create cluster --config cluster/kind-config.yaml
# Ports 80/443 on your Mac go to the ingress controller on the control-plane
# node, so http://shop.localhost, http://grafana.localhost, ... just work.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ecommerce
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
