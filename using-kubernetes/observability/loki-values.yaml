# Loki in single-binary mode with local disk — right-sized for a laptop.
#   helm upgrade --install loki grafana/loki --version 7.3.0 -n observability -f observability/loki-values.yaml
deploymentMode: SingleBinary
loki:
  auth_enabled: false                 # one tenant, no X-Scope-OrgID header needed
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: loki_index_, period: 24h }
  limits_config:
    retention_period: 48h             # same 2 days as Prometheus
    allow_structured_metadata: true   # trace_id stored per line without becoming a label
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  persistence: { enabled: true, size: 5Gi }
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 768Mi }
# Simple-scalable components, caches, gateway and test pods are not needed here.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
