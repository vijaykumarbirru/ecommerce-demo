spring.application.name=order-service
server.port=${PORT:8003}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:shop}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.sql.init.mode=always

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.exchange=${RABBITMQ_EXCHANGE:ecommerce.events}

# The OTel Java agent puts trace_id/span_id into the logging MDC.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [order-service] trace_id=%X{trace_id} span_id=%X{span_id} %logger{24} - %msg%n
